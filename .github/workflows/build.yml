name: Fabric supported versions
on:
  push:
    branches: [main, minecraft-26.1.2, minecraft-26.2]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 26.1.2
            source: minecraft-26.1.2
          - minecraft: '26.2'
            source: minecraft-26.2
          - minecraft: '26.3'
            source: main
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.source == 'main' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request') && github.sha || matrix.source }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and validate
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="26.3.1-dev"; fi
          chmod +x gradlew
          ./gradlew assemble test runSmoke "-PreleaseVersion=$version" --stacktrace
          mkdir -p dist
          cp "build/libs/Firmod-${version}+mc${{ matrix.minecraft }}.jar" dist/
          sha256sum dist/*.jar
      - uses: actions/upload-artifact@v5
        with:
          name: firmament-${{ matrix.minecraft }}
          path: dist/*.jar
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: firmament-*
          merge-multiple: true
          path: dist
      - name: Publish all three jars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already published; keeping its verified assets."
          else
            gh release create "$GITHUB_REF_NAME" dist/*.jar --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Firmod ${GITHUB_REF_NAME#v}" --generate-notes
          fi
